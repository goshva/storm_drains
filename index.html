<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mobile-first приложение для обслуживания ливневой канализации поместья: роли, чек-листы уровней контроля, статус объектов.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дренаж Поместья">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Дренаж Поместья</title>
<style>
  :root{
    --bg:#F2F2F7;
    --bg-desktop:#E5E5EA;
    --surface:#FFFFFF;
    --surface-2:#EFEFF4;
    --border:#E1E1E6;
    --border-soft:#EAEAEE;
    --text:#1C1C1E;
    --text-2:#6E6E73;
    --text-3:#AEAEB2;
    --accent:#007AFF;
    --accent-strong:#0058CC;
    --accent-soft:#E9F2FF;
    --gold:#FF9500;
    --gold-soft:#FFF1DE;
    --success:#34C759;
    --success-soft:#E6F9EA;
    --warning:#FF9500;
    --warning-soft:#FFF1DE;
    --critical:#FF3B30;
    --critical-soft:#FFEBE9;
    --indigo:#5856D6;
    --indigo-soft:#EAE9FB;
    --shadow-1:0 1px 2px rgba(28,28,30,.04);
    --shadow-2:0 22px 44px -20px rgba(28,28,30,.32);
    --tabbar-bg:rgba(249,249,251,.82);
    --sheet-bg:#FFFFFF;
    --overlay:rgba(0,0,0,.38);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --bg-desktop:#000000;
      --surface:#1C1C1E;
      --surface-2:#2C2C2E;
      --border:#38383A;
      --border-soft:#2C2C2E;
      --text:#F5F5F7;
      --text-2:#98989D;
      --text-3:#68686D;
      --accent:#0A84FF;
      --accent-strong:#409CFF;
      --accent-soft:#122A44;
      --gold:#FF9F0A;
      --gold-soft:#3A2A0E;
      --success:#30D158;
      --success-soft:#12281A;
      --warning:#FF9F0A;
      --warning-soft:#3A2A0E;
      --critical:#FF453A;
      --critical-soft:#3A1512;
      --indigo:#7D7AFF;
      --indigo-soft:#211F3E;
      --shadow-1:0 1px 2px rgba(0,0,0,.5);
      --shadow-2:0 22px 44px -20px rgba(0,0,0,.75);
      --tabbar-bg:rgba(20,20,22,.82);
      --sheet-bg:#1C1C1E;
      --overlay:rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000;
    --bg-desktop:#000000;
    --surface:#1C1C1E;
    --surface-2:#2C2C2E;
    --border:#38383A;
    --border-soft:#2C2C2E;
    --text:#F5F5F7;
    --text-2:#98989D;
    --text-3:#68686D;
    --accent:#0A84FF;
    --accent-strong:#409CFF;
    --accent-soft:#122A44;
    --gold:#FF9F0A;
    --gold-soft:#3A2A0E;
    --success:#30D158;
    --success-soft:#12281A;
    --warning:#FF9F0A;
    --warning-soft:#3A2A0E;
    --critical:#FF453A;
    --critical-soft:#3A1512;
    --indigo:#7D7AFF;
    --indigo-soft:#211F3E;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 22px 44px -20px rgba(0,0,0,.75);
    --tabbar-bg:rgba(20,20,22,.82);
    --sheet-bg:#1C1C1E;
    --overlay:rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-desktop);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:inherit;font-weight:700;letter-spacing:-.02em;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .stage{display:flex;justify-content:center;min-height:100%;}
  .app-frame{
    width:100%;
    max-width:480px;
    min-height:100%;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    isolation:isolate;
  }
  @media (min-width:760px){
    body{display:flex;justify-content:center;padding-block:36px;}
    .stage{align-items:flex-start;}
    .app-frame{
      width:414px;height:850px;min-height:850px;max-height:850px;
      border-radius:46px;
      box-shadow:var(--shadow-2), 0 0 0 10px #0d0f0b, 0 0 0 11px var(--border);
      overflow:hidden;
    }
  }

  header.topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--bg); border-bottom:1px solid var(--border-soft);
    padding:14px 20px 14px;
  }
  .topbar__row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .topbar__eyebrow{font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:0 0 2px;display:flex;align-items:center;gap:5px;}
  .topbar__roleicon{display:inline-flex;color:var(--accent);}
  .topbar__roleicon svg{width:13px;height:13px;}
  .topbar__title{font-weight:700;font-size:29px;line-height:1.15;margin:0;letter-spacing:-.02em;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;
    background:var(--surface-2);display:flex;align-items:center;justify-content:center;
    color:var(--text);flex:none;
  }
  .icon-btn--sos{background:var(--critical-soft);color:var(--critical);}
  .icon-btn svg{width:19px;height:19px;}

  main.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px calc(96px + env(safe-area-inset-bottom,0px));}
  main.scroll::-webkit-scrollbar{width:0;}

  nav.tabbar{
    position:sticky;bottom:0;z-index:5;
    display:flex;gap:2px;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--tabbar-bg);
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border-top:1px solid var(--border-soft);
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px 4px;border:none;background:transparent;border-radius:14px;color:var(--text-3);
  }
  .tab svg{width:22px;height:22px;}
  .tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em;}
  .tab.is-active{color:var(--accent);}

  section.block{margin-bottom:22px;}
  .block__head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:10px;}
  .block__title{font-size:13.5px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--text-2);}
  .block__link{font-size:14.5px;font-weight:500;color:var(--accent);background:none;border:none;display:flex;align-items:center;gap:2px;}
  .block__link svg{width:15px;height:15px;}

  .card{background:var(--surface);border:none;border-radius:16px;box-shadow:var(--shadow-1);}
  .card-pad{padding:16px;}

  .banner{
    border-radius:20px;padding:18px;background:linear-gradient(155deg,var(--accent) 0%, var(--accent-strong) 100%);
    color:#FFFFFF;position:relative;overflow:hidden;
  }
  .banner__tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:5px 10px 5px 8px;border-radius:100px;}
  .banner__tag svg{width:14px;height:14px;}
  .banner__title{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:10px 0 6px;}
  .banner__text{font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.88);margin:0;}

  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{background:var(--surface);border:none;border-radius:16px;padding:14px;box-shadow:var(--shadow-1);text-align:center;}
  .kpi__label{font-size:12px;color:var(--text-2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;}
  .kpi__label svg{width:14px;height:14px;color:var(--text-3);}
  .kpi__value{
    font-size:2em;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;
    text-align:center;
  }
  .kpi__sub{font-size:12px;color:var(--text-3);margin-top:3px;font-variant-numeric:tabular-nums;}
  .kpi__value.c-crit{color:var(--critical);}
  .kpi__value.c-ok{color:var(--success);}

  .list{background:var(--surface);border:none;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-1);}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border-soft);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;}
  .row:last-child{border-bottom:none;}
  .row__icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--accent-soft);color:var(--accent);}
  .row__icon svg{width:18px;height:18px;}
  .row__icon.gold{background:var(--gold-soft);color:var(--gold);}
  .row__icon.indigo{background:var(--indigo-soft);color:var(--indigo);}
  .row__body{flex:1;min-width:0;}
  .row__title{font-size:16px;font-weight:500;margin:0;}
  .row__meta{font-size:13.5px;color:var(--text-2);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row__chev{width:17px;height:17px;color:var(--text-3);flex:none;}

  .pill{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;flex:none;padding:0;}
  .pill svg{width:13px;height:13px;}
  .pill--ok{background:var(--success-soft);color:var(--success);}
  .pill--warn{background:var(--warning-soft);color:var(--warning);}
  .pill--crit{background:var(--critical-soft);color:var(--critical);}
  .pill--neutral{background:var(--surface-2);color:var(--text-2);}

  .level-chips{display:inline-flex;gap:4px;}
  .level-chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);flex:none;}
  .level-chip.gold{background:var(--gold-soft);color:var(--gold);}
  .level-chip svg{width:12px;height:12px;}

  .obj-card{display:flex;align-items:center;gap:10px;padding:14px;background:var(--surface);border:none;border-radius:16px;text-align:left;width:100%;box-shadow:var(--shadow-1);}
  .obj-card__main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;}
  .obj-card__icon{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
  .obj-card__icon svg{width:20px;height:20px;}
  .obj-card__top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .obj-card__name{font-size:16px;font-weight:600;margin:0;}
  .obj-card__zone{font-size:13px;color:var(--text-2);margin:2px 0 8px;}
  .obj-card__foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--text-3);}
  .stack{display:flex;flex-direction:column;gap:10px;}

  .task-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border-soft);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;}
  .task-row:last-child{border-bottom:none;}
  .check{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface);transition:background .15s,border-color .15s;}
  .check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.6);transition:opacity .15s, transform .15s;}
  .task-row.is-done .check{background:var(--accent);border-color:var(--accent);}
  .task-row.is-done .check svg{opacity:1;transform:scale(1);}
  .task-row.is-done .task-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--border);}
  .task-title{font-size:16px;font-weight:500;margin:0;}
  .task-note{font-size:13px;color:var(--text-2);margin:2px 0 0;}

  .progress{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;}
  .progress__fill{height:100%;border-radius:100px;background:var(--accent);}
  .progress__fill.gold{background:var(--gold);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:600;padding:13px 18px;border-radius:14px;border:none;width:100%;transition:opacity .12s;}
  .btn:active{opacity:.7;}
  .btn svg{width:17px;height:17px;}
  .btn--primary{background:var(--accent);color:#FFFFFF;}
  .btn--tint{background:var(--accent-soft);color:var(--accent);}
  .btn--ghost{background:var(--surface-2);color:var(--text);}
  .btn--danger{background:var(--critical);color:#fff;}

  .segmented{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px;}
  .segmented__opt{flex:1;text-align:center;padding:7px 6px;border-radius:8px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text-2);transition:background .15s,color .15s,box-shadow .15s;}
  .segmented__opt.is-active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14);}

  .ring{position:relative;width:52px;height:52px;flex:none;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring__num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);}

  .divider{height:1px;background:var(--border-soft);margin:18px 0;}

  /* role picker */
  .picker{min-height:100%;display:flex;flex-direction:column;padding:calc(30px + env(safe-area-inset-top,0px)) 24px 32px;background:
      radial-gradient(120% 60% at 50% -10%, var(--accent-soft), transparent 60%), var(--bg);}
  .picker__brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:30px;}
  .picker__mark{width:62px;height:62px;border-radius:18px;background:var(--accent);color:#FFFFFF;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:var(--shadow-2);}
  .picker__mark svg{width:30px;height:30px;}
  .picker__name{font-weight:700;font-size:27px;letter-spacing:-.02em;margin:0;}
  .picker__sub{font-size:14.5px;color:var(--text-2);margin:6px 0 0;max-width:280px;}
  .picker__date{margin-top:14px;font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--text-2);background:var(--surface);border:none;padding:6px 12px;border-radius:100px;box-shadow:var(--shadow-1);}
  .picker__label{font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--text-3);margin:4px 4px 10px;}

  /* modal sheet */
  .overlay{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
  .overlay.is-open{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--sheet-bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:0 -20px 50px rgba(0,0,0,.25);}
  .overlay.is-open .sheet{transform:translateY(0);}
  .sheet__grab{width:36px;height:5px;border-radius:100px;background:var(--border);margin:10px auto 4px;flex:none;}
  .sheet__head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 20px 12px;flex:none;}
  .sheet__title{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0;padding-right:8px;}
  .sheet__body{padding:0 20px 24px;overflow-y:auto;}

  .kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:14.5px;}
  .kv:last-child{border-bottom:none;}
  .kv__k{color:var(--text-2);}
  .kv__v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}

  .raci{width:100%;border-collapse:collapse;font-size:13px;}
  .raci th,.raci td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border-soft);}
  .raci th{color:var(--text-3);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
  .raci td:first-child,.raci th:first-child{text-align:left;color:var(--text-2);font-weight:600;}
  .raci-tag{display:inline-flex;width:22px;height:22px;border-radius:7px;align-items:center;justify-content:center;font-weight:700;font-size:11px;}
  .raci-tag.r{background:var(--accent-soft);color:var(--accent);}
  .raci-tag.a{background:var(--gold-soft);color:var(--gold);}
  .raci-tag.c{background:var(--surface-2);color:var(--text-2);}
  .raci-tag.i{background:transparent;color:var(--text-3);}
  .raci-tag.none{background:var(--surface-2);color:var(--text-3);}
  button.raci-tag{border:none;font:inherit;cursor:pointer;}

  .raci-legend{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
  .raci-legend__item{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-2);}

  .form-field{margin-bottom:14px;}
  .form-field:last-child{margin-bottom:0;}
  .form-field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
  .form-field input[type="text"]{
    width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--surface-2);
    border:none;border-radius:12px;padding:12px 13px;
  }
  .form-field input[type="text"]::placeholder{color:var(--text-3);}
  .form-field input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .chip-toggles{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:100px;border:none;background:var(--surface-2);color:var(--text-2);font-size:13.5px;font-weight:600;}
  .chip-toggle svg{width:14px;height:14px;}
  .chip-toggle.is-active{background:var(--accent);color:#FFFFFF;}

  .list-row-actions{display:flex;align-items:center;gap:10px;}
  .delete-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--critical-soft);color:var(--critical);display:flex;align-items:center;justify-content:center;flex:none;}
  .delete-btn svg{width:14px;height:14px;}

  .empty{text-align:center;padding:40px 20px;color:var(--text-3);}
  .empty svg{width:34px;height:34px;margin-bottom:10px;}
  .empty p{font-size:13.5px;margin:0;}

  [hidden]{display:none !important;}

  .toast{
    position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    width:calc(100% - 32px);max-width:400px;z-index:15;
    background:var(--sheet-bg);color:var(--text);border-radius:16px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-2);
  }
  .toast__icon{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
  .toast__icon svg{width:16px;height:16px;}
  .toast--offline .toast__icon{background:var(--warning-soft);color:var(--warning);}
  .toast__text{flex:1;font-size:13.5px;font-weight:500;line-height:1.3;}
  .toast__action{flex:none;background:var(--accent);color:#FFFFFF;border:none;font-size:13px;font-weight:600;padding:8px 13px;border-radius:100px;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script>
(function(){
  'use strict';
  var STORAGE_KEY = 'estate_drainage_v1';
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

  var ROLES = [
    {id:'owner', name:'Владелец поместья', tag:'Владелец', level:0, icon:'i-crown', desc:'Стратегия, бюджет и контроль всех четырёх уровней'},
    {id:'l1', name:'Дежурная служба', tag:'Уровень I', level:1, icon:'i-drop', desc:'Ежедневный оперативный обход и очистка'},
    {id:'l2', name:'Техник по эксплуатации', tag:'Уровень II', level:2, icon:'i-wrench', desc:'Еженедельная промывка лотков и диагностика'},
    {id:'l3', name:'Инженер по эксплуатации', tag:'Уровень III', level:3, icon:'i-gauge', desc:'Ежемесячная гидродинамика и телеинспекция'},
    {id:'l4', name:'Главный инженер', tag:'Уровень IV', level:4, icon:'i-shield', desc:'Сезонный аудит и стратегическое планирование'},
    {id:'admin', name:'Администратор системы', tag:'Администратор', level:5, icon:'i-admin', desc:'Объекты, роли пользователей и матрица ответственности'}
  ];
  function isOperationalRole(r){ return r.level>=1 && r.level<=4; }

  var TASKS = {
    l1:[
      {id:'d1', title:'Осмотр дождеприёмников', note:'После осадков, весь периметр поместья'},
      {id:'d2', title:'Очистка решёток', note:'От листвы, веток и бытового мусора'},
      {id:'d3', title:'Контроль подтоплений', note:'Входные группы зданий и террасы'},
      {id:'d4', title:'Проверка насосов', note:'Визуальный контроль работы оборудования'}
    ],
    l2:[
      {id:'w1', title:'Промывка лотков', note:'Вода под давлением, все открытые каналы'},
      {id:'w2', title:'Очистка песколовок', note:'Песколовки и первичные отстойники'},
      {id:'w3', title:'Проверка уклонов', note:'Геометрия поверхности у дождеприёмников'},
      {id:'w4', title:'Фотофиксация участков', note:'Проблемные зоны с привязкой к схеме'},
      {id:'w5', title:'Тестовый пролив', note:'Чистой водой — контроль пропускной способности'}
    ],
    l3:[
      {id:'m1', title:'Гидродинамическая промывка', note:'Трубопроводы, спецоборудование 150–200 атм'},
      {id:'m2', title:'Теледиагностика труб', note:'Видеокамера, поиск внутренних дефектов'},
      {id:'m3', title:'Очистка коллекторов', note:'Смотровые колодцы глубокого заложения'},
      {id:'m4', title:'Проверка герметичности', note:'Соединения и стыки трубопроводов'},
      {id:'m5', title:'Калибровка датчиков', note:'Уровень воды в автоматизированных узлах'}
    ],
    l4:[
      {id:'q1', title:'Полное освидетельствование', note:'Техническое состояние всей системы'},
      {id:'q2', title:'Сезонная подготовка', note:'Регламент текущего сезона эксплуатации'},
      {id:'q3', title:'Анализ эффективности', note:'Итоги за прошедший период'},
      {id:'q4', title:'Планирование модернизации', note:'Бюджет и график ремонтных работ'},
      {id:'q5', title:'Обновление документации', note:'Исполнительные схемы сетей (As-built)'}
    ]
  };

  var OBJECTS_SEED = [
    {id:'o1', name:'Дождеприёмник', zone:'Главный въезд', icon:'i-drop', status:'ok', updated:'сегодня', levels:[1]},
    {id:'o2', name:'Лоток открытый', zone:'Восточный сад', icon:'i-drop', status:'warn', updated:'2 дня назад', levels:[1,2], issue:'Скопление опавшей листвы снижает сток'},
    {id:'o3', name:'Песколовка', zone:'Западный периметр', icon:'i-grid', status:'ok', updated:'5 дней назад', levels:[2]},
    {id:'o4', name:'Коллектор №1', zone:'Хозяйственный двор', icon:'i-grid', status:'ok', updated:'3 недели назад', levels:[3]},
    {id:'o5', name:'Колодец смотровой', zone:'Аллея у пруда', icon:'i-alert', status:'crit', updated:'сегодня', levels:[3], issue:'Подпор воды, требуется внеплановая прочистка'},
    {id:'o6', name:'Насосная камера', zone:'Нижний парк', icon:'i-gauge', status:'ok', updated:'1 месяц назад', levels:[3,4]},
    {id:'o7', name:'Водосток кровельный', zone:'Главный дом, южный фасад', icon:'i-drop', status:'warn', updated:'4 дня назад', levels:[1], issue:'Ослабло крепление хомута'}
  ];

  var USERS_SEED = [
    {id:'u1', name:'Иван Петров', roleId:'l1'},
    {id:'u2', name:'Сергей Волков', roleId:'l1'},
    {id:'u3', name:'Алексей Ким', roleId:'l2'},
    {id:'u4', name:'Дмитрий Орлов', roleId:'l3'},
    {id:'u5', name:'Николай Гроссман', roleId:'l4'},
    {id:'u6', name:'Мария Соколова', roleId:'owner'}
  ];

  var SEASONS = {
    spring:{name:'Весенний регламент', range:'март — май', points:[
      'Экстренная проверка системы после схода снега',
      'Очистка от ледяных пробок и песчаных наносов',
      'Ревизия креплений водостоков после снеговой нагрузки',
      'Проверка дренажных насосов перед сезоном ливней'
    ]},
    summer:{name:'Летний регламент', range:'июнь — август', points:[
      'Контроль зарастания открытых каналов травой',
      'Промывка системы после пыльных бурь и стройработ',
      'Проверка температурного режима колодцев с электрооборудованием'
    ]},
    autumn:{name:'Осенний регламент', range:'сентябрь — ноябрь', points:[
      'Временные сетки на дождеприёмники под кронами деревьев',
      'Повышенная частота очистки пескоуловителей от листвы',
      'Финальная продувка и консервация промерзающих участков'
    ]},
    winter:{name:'Зимний регламент', range:'декабрь — февраль', points:[
      'Контроль обледенения решёток, системы антиобледенения',
      'Отказ от технической соли — только гранитная крошка',
      'Теплоизоляция оголовков выпусков'
    ]}
  };

  var RACI_SEED = [
    {op:'Очистка решётки', r:['R','C','I','I']},
    {op:'Тестовый пролив', r:['I','A','C','I']},
    {op:'Гидродинамика труб', r:['I','R','A','C']},
    {op:'Бюджет ремонта', r:['I','I','C','A']}
  ];
  var RACI_ROLES = ['I','II','III','IV'];
  var RACI_LEGEND = [
    {k:'r', label:'Исполнитель'},
    {k:'a', label:'Ответственный'},
    {k:'c', label:'Согласующий'},
    {k:'i', label:'Информируемый'}
  ];

  function icon(id, extraClass){ return '<svg class="'+(extraClass||'')+'"><use href="#'+id+'"></use></svg>'; }

  function todayInfo(){
    var d = new Date();
    var wd = WEEKDAYS[d.getDay()];
    var str = wd.charAt(0).toUpperCase()+wd.slice(1)+', '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
    var m = d.getMonth()+1, seasonKey;
    if(m>=3&&m<=5) seasonKey='spring'; else if(m>=6&&m<=8) seasonKey='summer'; else if(m>=9&&m<=11) seasonKey='autumn'; else seasonKey='winter';
    return {dateStr:str, seasonKey:seasonKey, season:SEASONS[seasonKey]};
  }
  var TODAY = todayInfo();

  function load(){ try{ var raw=localStorage.getItem(STORAGE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        role: state.role,
        checked: state.checked,
        objects: state.objects,
        users: state.users,
        raci: state.raci
      }));
    }catch(e){}
  }

  var THEME_KEY = 'estate_drainage_theme';
  function loadTheme(){ try{ return localStorage.getItem(THEME_KEY)||'system'; }catch(e){ return 'system'; } }
  function applyTheme(t){
    if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  function setTheme(t){
    state.theme = t;
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
    applyTheme(t);
    render();
  }

  var saved = load();
  var state = {
    role: saved && saved.role ? saved.role : null,
    tab: 'home',
    checked: saved && saved.checked ? saved.checked : {},
    objects: saved && saved.objects ? saved.objects : JSON.parse(JSON.stringify(OBJECTS_SEED)),
    users: saved && saved.users ? saved.users : JSON.parse(JSON.stringify(USERS_SEED)),
    raci: saved && saved.raci ? saved.raci : JSON.parse(JSON.stringify(RACI_SEED)),
    theme: loadTheme(),
    modal: null,
    online: navigator.onLine,
    updateReady: false,
    canInstall: false,
    formDraft: null
  };
  applyTheme(state.theme);
  var nextObjectSeq = state.objects.length + 1;
  var nextUserSeq = state.users.length + 1;

  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }

  function roleObj(id){ for(var i=0;i<ROLES.length;i++){ if(ROLES[i].id===id) return ROLES[i]; } return null; }
  function tasksDone(levelId){ var c = state.checked[levelId]||{}; return Object.keys(c).filter(function(k){return c[k];}).length; }
  function tasksTotal(levelId){ return (TASKS[levelId]||[]).length; }
  function pct(levelId){ var t=tasksTotal(levelId); return t? Math.round(tasksDone(levelId)/t*100):0; }

  var STATUS_LABEL = {ok:'Норма', warn:'Внимание', crit:'Критично'};
  function statusPill(status){
    var cls = status==='ok' ? 'pill--ok' : (status==='warn' ? 'pill--warn' : 'pill--crit');
    var ic = status==='ok' ? 'i-check-c' : 'i-alert';
    return '<span class="pill '+cls+'" title="'+STATUS_LABEL[status]+'" aria-label="'+STATUS_LABEL[status]+'">'+icon(ic)+'</span>';
  }

  function levelChip(levelNum){
    var r = ROLES[levelNum]; if(!r) return '';
    return '<span class="level-chip'+(levelNum===0?' gold':'')+'" title="'+r.tag+'" aria-label="'+r.tag+'">'+icon(r.icon)+'</span>';
  }
  function levelChips(levels){
    return '<span class="level-chips">'+(levels||[]).map(levelChip).join('')+'</span>';
  }

  function ring(percent, colorVar){
    var size=52, stroke=5, r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-percent/100);
    return '<div class="ring"><svg viewBox="0 0 '+size+' '+size+'">'+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--border-soft)" stroke-width="'+stroke+'"/>'+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(colorVar||'var(--accent)')+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'+
      '</svg><div class="ring__num">'+percent+'%</div></div>';

  var TABS_OWNER = [
    {id:'home', label:'Сегодня', icon:'i-home'},
    {id:'levels', label:'Уровни', icon:'i-users'},
    {id:'objects', label:'Объекты', icon:'i-grid'},
    {id:'profile', label:'Профиль', icon:'i-user'}
  ];
  var TABS_STAFF = [
    {id:'home', label:'Сегодня', icon:'i-home'},
    {id:'tasks', label:'Задачи', icon:'i-tasks'},
    {id:'objects', label:'Объекты', icon:'i-grid'},
    {id:'profile', label:'Профиль', icon:'i-user'}
  ];
  var TABS_ADMIN = [
    {id:'home', label:'Обзор', icon:'i-home'},
    {id:'objects', label:'Объекты', icon:'i-grid'},
    {id:'roles', label:'Роли', icon:'i-users'},
    {id:'matrix', label:'Матрица', icon:'i-admin'},
    {id:'profile', label:'Профиль', icon:'i-user'}

  function roleTileClass(r){
    if(r.id==='admin') return ' indigo';
    if(r.level===0) return ' gold';
    return '';
  }

  function render(){
    var app = document.getElementById('app');
    if(!state.role){ app.innerHTML = renderPicker(); return; }
    var role = roleObj(state.role);
    var tabs = role.id==='admin' ? TABS_ADMIN : (role.level===0 ? TABS_OWNER : TABS_STAFF);
    if(!tabs.some(function(t){return t.id===state.tab;})) state.tab='home';
    app.innerHTML = renderHeader(role) + renderMain(role) + renderTabbar(tabs);
  }

  function renderPicker(){
    var rows = ROLES.map(function(r){
      return '<button class="row" data-action="select-role" data-id="'+r.id+'">'+
        '<span class="row__icon'+roleTileClass(r)+'">'+icon(r.icon)+'</span>'+
        '<span class="row__body"><p class="row__title">'+r.name+'</p><p class="row__meta">'+r.desc+'</p></span>'+
        icon('i-chev-r','row__chev')+
      '</button>';
    }).join('');
    return '<div class="picker">'+
      '<div class="picker__brand">'+
        '<div class="picker__mark">'+icon('i-shield')+'</div>'+
        '<p class="picker__name serif">Поместье · Ливнёвая система</p>'+
        '<p class="picker__sub">Демонстрационный вход. Выберите роль, чтобы увидеть её рабочий интерфейс</p>'+
        '<span class="picker__date">'+TODAY.dateStr+'</span>'+
      '</div>'+
      '<p class="picker__label">Роли в системе</p>'+
      '<div class="list">'+rows+'</div>'+
    '</div>';
  }

  function renderHeader(role){
    var titles = {home: role.id==='admin' ? 'Обзор' : 'Сегодня', tasks:'Задачи', objects:'Объекты', levels:'Уровни контроля', profile:'Профиль', roles:'Роли пользователей', matrix:'Матрица ответственности'};
    return '<header class="topbar"><div class="topbar__row">'+
      '<div><p class="topbar__eyebrow"><span class="topbar__roleicon" title="'+role.tag+'" aria-label="'+role.tag+'">'+icon(role.icon)+'</span>'+TODAY.dateStr+'</p><h1 class="topbar__title serif">'+titles[state.tab]+'</h1></div>'+
      '<button class="icon-btn icon-btn--sos" data-action="open-sos" aria-label="Аварийный протокол">'+icon('i-siren')+'</button>'+
    '</div></header>';
  }

  function renderTabbar(tabs){
    return '<nav class="tabbar">'+tabs.map(function(t){
      return '<button class="tab'+(state.tab===t.id?' is-active':'')+'" data-tab="'+t.id+'">'+icon(t.icon)+'<span>'+t.label+'</span></button>';
    }).join('')+'</nav>';
  }

  function renderMain(role){
    var body='';
    if(state.tab==='home') body = role.id==='admin' ? adminHome(role) : (role.level===0 ? homeOwner(role) : homeStaff(role));
    else if(state.tab==='levels') body = levelsTab();
    else if(state.tab==='tasks') body = tasksTab(role);
    else if(state.tab==='objects') body = objectsTab(role);
    else if(state.tab==='roles') body = rolesTab(role);
    else if(state.tab==='matrix') body = matrixTab(role);
    else if(state.tab==='profile') body = profileTab(role);
    return '<main class="scroll">'+body+'</main>';
  }

  function homeOwner(role){
    var doneAll=0, totalAll=0, crit=0;
    ['l1','l2','l3','l4'].forEach(function(l){ doneAll+=tasksDone(l); totalAll+=tasksTotal(l); });
    state.objects.forEach(function(o){ if(o.status==='crit') crit++; });
    var okObjects = state.objects.filter(function(o){return o.status==='ok';}).length;
    var out = seasonBanner();
    out += '<section class="block"><div class="kpi-grid">'+
      kpi('i-tasks','Выполнено сегодня', doneAll+' / '+totalAll, 'по всем уровням', doneAll===totalAll&&totalAll>0?'c-ok':'')+
      kpi('i-grid','Объекты в норме', okObjects+' / '+state.objects.length, 'по данным обхода', '')+
      kpi('i-alert','Критических событий', String(crit), crit>0?'требуют реакции':'нет событий', crit>0?'c-crit':'c-ok')+
      kpi('i-bank','Бюджет квартала', '71%', '640 000 ₽ из 900 000 ₽', '')+
    '</div></section>';
    out += '<section class="block"><div class="block__head"><span class="block__title">Уровни контроля</span><button class="block__link" data-tab="levels">Все<svg><use href="#i-chev-r"></use></svg></button></div>'+
      '<div class="list">'+ROLES.filter(isOperationalRole).map(function(r){
        return '<button class="row" data-action="open-level" data-id="'+r.id+'">'+
          '<span class="row__icon">'+icon(r.icon)+'</span>'+
          '<span class="row__body"><p class="row__title">'+r.name+'</p><p class="row__meta">Выполнено '+tasksDone(r.id)+' из '+tasksTotal(r.id)+'</p></span>'+
          icon('i-chev-r','row__chev')+
        '</button>';
      }).join('')+'</div></section>';
    out += '<section class="block"><div class="block__head"><span class="block__title">Требуют внимания</span></div>'+objectList(state.objects.filter(function(o){return o.status!=='ok';}))+'</section>';
    return out;
  }

  function homeStaff(role){
    var lvl = role.id, done=tasksDone(lvl), total=tasksTotal(lvl);
    var out = seasonBanner();
    out += '<section class="block"><div class="card card-pad">'+
      '<div style="display:flex;align-items:center;gap:14px;">'+
        ring(pct(lvl))+
        '<div><p class="row__title" style="margin-bottom:3px;">Задачи на сегодня</p><p class="row__meta">Выполнено '+done+' из '+total+' пунктов регламента</p></div>'+
      '</div>'+
      '<div style="margin-top:14px;"><button class="btn btn--primary" data-tab="tasks">'+icon('i-tasks')+'Открыть чек-лист</button></div>'+
    '</div></section>';
    if(role.id==='l1'){
      out += '<section class="block"><div class="banner" style="background:linear-gradient(155deg,var(--critical) 0%, #7a2a20 100%);">'+
        '<span class="banner__tag">'+icon('i-siren')+'Экстренный протокол</span>'+
        '<p class="banner__title serif">Реакция на подтопление — 15 минут</p>'+
        '<p class="banner__text">При критическом затоплении: оповестите главного инженера, выезжайте с мотопомпой, установите водоналивные барьеры.</p>'+
      '</div></section>';
    }
    out += '<section class="block"><div class="block__head"><span class="block__title">Объекты вашей зоны</span><button class="block__link" data-tab="objects">Все<svg><use href="#i-chev-r"></use></svg></button></div>'+
      objectList(state.objects.slice(0,3))+'</section>';
    return out;
  }

  function seasonBanner(){
    return '<section class="block"><div class="banner">'+
      '<span class="banner__tag">'+icon('i-leaf')+TODAY.season.name+'</span>'+
      '<p class="banner__title serif">Регламент действует: '+TODAY.season.range+'</p>'+
      '<p class="banner__text">'+TODAY.season.points.join(' · ')+'</p>'+
    '</div></section>';
  }

  function kpi(iconId,label,value,sub,cls){
    return '<div class="kpi"><p class="kpi__label">'+icon(iconId)+label+'</p><p class="kpi__value '+(cls||'')+'">'+value+'</p><p class="kpi__sub">'+sub+'</p></div>';
  }

  function raciCellClass(v){
    if(v==='R') return 'r';
    if(v==='A') return 'a';
    if(v==='C') return 'c';
    if(v==='I') return 'i';
    return 'none';
  }
  function raciLegend(){
    return '<div class="raci-legend">'+RACI_LEGEND.map(function(x){
      return '<div class="raci-legend__item"><span class="raci-tag '+x.k+'">'+x.k.toUpperCase()+'</span><span>'+x.label+'</span></div>';
    }).join('')+'</div>';
  }

  function levelsTab(){
    var out = '<section class="block"><div class="stack">'+ROLES.filter(isOperationalRole).map(function(r){
      return '<button class="card card-pad" style="text-align:left;width:100%;display:flex;align-items:center;gap:14px;" data-action="open-level" data-id="'+r.id+'">'+
        ring(pct(r.id))+
        '<span style="flex:1;min-width:0;"><p class="row__title">'+r.name+'</p><p class="row__meta">'+r.desc+'</p></span>'+
        icon('i-chev-r','row__chev')+
      '</button>';
    }).join('')+'</div></section>';
    out += '<section class="block"><div class="block__head"><span class="block__title">Матрица ответственности</span></div>'+
      '<div class="card card-pad"><table class="raci"><thead><tr><th>Операция</th><th>I</th><th>II</th><th>III</th><th>IV</th></tr></thead><tbody>'+
      state.raci.map(function(row){ return '<tr><td>'+row.op+'</td>'+row.r.map(function(v){ return '<td><span class="raci-tag '+raciCellClass(v)+'">'+(v||'—')+'</span></td>'; }).join('')+'</tr>'; }).join('')+
      '</tbody></table>'+raciLegend()+'</div></section>';
    return out;
  }

  function tasksTab(role){
    var lvl = role.id, list = TASKS[lvl]||[], checked = state.checked[lvl]||{};
    var rows = list.map(function(t){
      var done = !!checked[t.id];
      return '<button class="task-row'+(done?' is-done':'')+'" data-action="toggle-task" data-level="'+lvl+'" data-id="'+t.id+'">'+
        '<span class="check">'+icon('i-check')+'</span>'+
        '<span class="row__body"><p class="task-title">'+t.title+'</p><p class="task-note">'+t.note+'</p></span>'+
      '</button>';
    }).join('');
    var freqLabel = {l1:'Ежедневный регламент', l2:'Еженедельный регламент', l3:'Ежемесячный регламент', l4:'Квартальный регламент'}[lvl];
    return '<section class="block"><div class="card card-pad"><div style="display:flex;align-items:center;gap:14px;">'+ring(pct(lvl))+
      '<div><p class="row__title">'+freqLabel+'</p><p class="row__meta">Выполнено '+tasksDone(lvl)+' из '+tasksTotal(lvl)+'</p></div></div>'+
      '<div class="progress" style="margin-top:12px;"><div class="progress__fill" style="width:'+pct(lvl)+'%"></div></div></div></section>'+
      '<section class="block"><div class="list">'+rows+'</div></section>'+
      '<section class="block"><button class="btn btn--tint" data-action="open-camera">'+icon('i-camera')+'Фотофиксация с GPS-меткой</button></section>';
  }

  function objectList(list, opts){
    opts = opts || {};
    if(!list.length) return '<div class="empty">'+icon('i-check-c')+'<p>Все объекты в норме</p></div>';
    return '<div class="stack">'+list.map(function(o){
      var inner = '<span class="obj-card__icon">'+icon(o.icon)+'</span>'+
        '<span style="flex:1;min-width:0;">'+
          '<span class="obj-card__top"><span class="obj-card__name">'+o.name+'</span>'+statusPill(o.status)+'</span>'+
          '<p class="obj-card__zone">'+icon('i-pin','row__chev')+' '+o.zone+'</p>'+
          '<span class="obj-card__foot">'+levelChips(o.levels)+'<span>обновлено '+o.updated+'</span></span>'+
        '</span>';
      if(opts.admin){
        return '<div class="obj-card">'+
          '<button class="obj-card__main" data-action="open-object" data-id="'+o.id+'">'+inner+'</button>'+
          '<button class="delete-btn" data-action="delete-object" data-id="'+o.id+'" aria-label="Удалить объект">'+icon('i-trash')+'</button>'+
        '</div>';
      }
      return '<button class="obj-card" data-action="open-object" data-id="'+o.id+'">'+inner+'</button>';
    }).join('')+'</div>';
  }

  function objectsTab(role){
    var isAdmin = role.id==='admin';
    var out = '<section class="block">'+objectList(state.objects, {admin:isAdmin})+'</section>';
    if(isAdmin){
      out += '<section class="block"><button class="btn btn--tint" data-action="open-object-form">'+icon('i-plus')+'Добавить объект</button></section>';
    }
    return out;
  }

  function profileTab(role){
    var out = '<section class="block"><div class="card card-pad" style="display:flex;align-items:center;gap:14px;">'+
      '<span class="row__icon'+roleTileClass(role)+'" style="width:52px;height:52px;border-radius:14px;">'+icon(role.icon)+'</span>'+
      '<div class="row__body"><p class="row__title" style="font-size:17.5px;">'+role.name+'</p><p class="row__meta" style="white-space:normal;">'+role.desc+'</p></div>'+

    if(role.level===0){
      out += '<section class="block"><div class="block__head"><span class="block__title">Бюджет обслуживания</span></div><div class="card card-pad">'+
        '<div class="kv"><span class="kv__k">Квартал</span><span class="kv__v">III — '+TODAY.season.range+'</span></div>'+
        '<div class="kv"><span class="kv__k">Израсходовано</span><span class="kv__v">640 000 ₽</span></div>'+
        '<div class="kv"><span class="kv__k">Утверждённый лимит</span><span class="kv__v">900 000 ₽</span></div>'+
        '<div class="progress" style="margin-top:12px;"><div class="progress__fill gold" style="width:71%"></div></div>'+
      '</div></section>';
    } else if(role.id==='admin'){
      out += '<section class="block"><div class="block__head"><span class="block__title">Данные системы</span></div><div class="card card-pad">'+
        '<div class="kv"><span class="kv__k">Объектов в реестре</span><span class="kv__v">'+state.objects.length+'</span></div>'+
        '<div class="kv"><span class="kv__k">Пользователей</span><span class="kv__v">'+state.users.length+'</span></div>'+
        '<div class="kv"><span class="kv__k">Операций в матрице</span><span class="kv__v">'+state.raci.length+'</span></div>'+
      '</div></section>';
    } else {
      out += '<section class="block"><div class="block__head"><span class="block__title">Документооборот уровня</span></div><div class="card card-pad">'+
        '<div class="kv"><span class="kv__k">Форма отчётности</span><span class="kv__v">'+docType(role.id)+'</span></div>'+
        '<div class="kv"><span class="kv__k">Срок устранения критично</span><span class="kv__v">'+(role.id==='l1'?'до 2 часов':'по регламенту')+'</span></div>'+
      '</div></section>';
    }

    out += '<section class="block"><div class="block__head"><span class="block__title">'+TODAY.season.name+'</span></div><div class="card card-pad"><ul style="margin:0;padding-left:18px;color:var(--text);font-size:14.5px;line-height:1.7;">'+
      TODAY.season.points.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul></div></section>';

    out += themeControl();
    out += installControl();

    out += '<section class="block"><button class="btn btn--ghost" data-action="switch-role">'+icon('i-chev-l')+'Сменить роль</button></section>';
    return out;
  }

  function themeControl(){
    var opts = [{v:'system',l:'Системная'},{v:'light',l:'Светлая'},{v:'dark',l:'Тёмная'}];
    return '<section class="block"><div class="block__head"><span class="block__title">Оформление</span></div>'+

        return '<button class="segmented__opt'+(state.theme===o.v?' is-active':'')+'" data-action="set-theme" data-value="'+o.v+'">'+o.l+'</button>';

      '<div class="form-field"><label>Имя сотрудника</label><input type="text" id="fUserName" placeholder="Например, Анна Смирнова"></div>'+
      '<div class="form-field"><label>Роль</label><div class="chip-toggles">'+
        ROLES.filter(function(r){return r.id!=='admin';}).map(function(r){ return '<button type="button" class="chip-toggle" data-action="form-role-pick" data-value="'+r.id+'">'+icon(r.icon)+r.name+'</button>'; }).join('')+
      '</div></div>'+
      '<button class="btn btn--primary" data-action="save-user" style="margin-top:6px;">'+icon('i-check')+'Добавить пользователя</button>';
    openSheet('Новый пользователь', body);
  }

  function openRaciForm(){
    var body =
      '<div class="form-field"><label>Название операции</label><input type="text" id="fRaciOp" placeholder="Например, Осмотр колодцев"></div>'+
      '<p class="row__meta" style="margin-bottom:14px;white-space:normal;">После добавления назначьте роли R/A/C/I, нажимая на ячейки таблицы.</p>'+
      '<button class="btn btn--primary" data-action="save-raci-row">'+icon('i-check')+'Добавить операцию</button>';
    openSheet('Новая операция', body);
  }

  // ---- modal sheets ----
  function openSheet(title, bodyHtml){
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetBody').innerHTML = bodyHtml;
    document.getElementById('overlay').classList.add('is-open');
  }
  function closeSheet(){ document.getElementById('overlay').classList.remove('is-open'); }

  function openObject(id){
    var o=null; for(var i=0;i<state.objects.length;i++){ if(state.objects[i].id===id) o=state.objects[i]; }
    if(!o) return;
    var body = '<div style="margin-bottom:14px;">'+statusPill(o.status)+'</div>'+
      (o.issue?'<p style="font-size:13.5px;color:var(--text-2);margin:0 0 16px;">'+o.issue+'</p>':'')+
      '<div class="card card-pad">'+
        '<div class="kv"><span class="kv__k">Зона</span><span class="kv__v">'+o.zone+'</span></div>'+
        '<div class="kv"><span class="kv__k">Ответственный уровень</span><span class="kv__v">'+levelChips(o.levels)+'</span></div>'+
        '<div class="kv"><span class="kv__k">Последняя проверка</span><span class="kv__v">'+o.updated+'</span></div>'+
      '</div>'+
      '<div style="margin-top:16px;"><button class="btn btn--primary" data-action="close-modal">'+icon('i-check')+'Отметить как проверено</button></div>';
    openSheet(o.name, body);
  }

  function openLevel(id){
    var r = roleObj(id); if(!r) return;
    var list = TASKS[id]||[];
    var body = '<div class="card card-pad" style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">'+ring(pct(id))+
      '<div><p class="row__title">'+r.desc+'</p><p class="row__meta">Выполнено '+tasksDone(id)+' из '+tasksTotal(id)+'</p></div></div>'+
      '<div class="list">'+list.map(function(t){
        var done=!!(state.checked[id]||{})[t.id];
        return '<div class="row"><span class="row__icon'+(done?'':' gold')+'">'+icon(done?'i-check-c':'i-clock')+'</span>'+
          '<span class="row__body"><p class="row__title">'+t.title+'</p><p class="row__meta">'+t.note+'</p></span></div>';
      }).join('')+'</div>';
    openSheet(r.name, body);
  }

  function openSOS(){
    var body = '<p style="font-size:13.5px;color:var(--text-2);line-height:1.6;margin:0 0 16px;">При обнаружении критического подтопления действует аварийный регламент вне графика.</p>'+
      '<div class="list">'+
        stepRow('1','Оповещение', 'Главный инженер + отключение насосных камер')+
        stepRow('2','Выезд бригады', 'Переносная мотопомпа, в течение 15 минут')+
        stepRow('3','Локализация', 'Водоналивные барьеры на зоне затопления')+
        stepRow('4','Внеплановая прочистка', 'Гидродинамическая промывка вне графика')+
      '</div>'+
      '<div style="margin-top:16px;"><button class="btn btn--danger" data-action="close-modal">'+icon('i-siren')+'Понятно, протокол изучен</button></div>';
    openSheet('Аварийный протокол', body);
  }
  function stepRow(n,title,meta){
    return '<div class="row"><span class="row__icon" style="background:var(--critical-soft);color:var(--critical);font-weight:700;">'+n+'</span>'+
      '<span class="row__body"><p class="row__title">'+title+'</p><p class="row__meta">'+meta+'</p></span></div>';
  }

  function openCamera(){
    var body = '<div class="empty">'+icon('i-camera')+'<p>Демонстрация: снимок и GPS-метка будут приложены к отчёту по объекту</p></div>'+
      '<button class="btn btn--primary" data-action="close-modal">'+icon('i-check')+'Симулировать снимок</button>';
    openSheet('Фотофиксация', body);
  }

  // ---- events ----
  document.addEventListener('click', function(e){
    var roleBtn = e.target.closest('[data-action="select-role"]');
    if(roleBtn){ state.role = roleBtn.getAttribute('data-id'); state.tab='home'; save(); render(); return; }

    var switchBtn = e.target.closest('[data-action="switch-role"]');
    if(switchBtn){ state.role=null; render(); return; }

    var tabBtn = e.target.closest('[data-tab]');
    if(tabBtn){ state.tab = tabBtn.getAttribute('data-tab'); render(); return; }

    var toggle = e.target.closest('[data-action="toggle-task"]');
    if(toggle){
      var lvl = toggle.getAttribute('data-level'), id = toggle.getAttribute('data-id');
      state.checked[lvl] = state.checked[lvl]||{};
      state.checked[lvl][id] = !state.checked[lvl][id];
      save(); render();
      return;
    }

    var objBtn = e.target.closest('[data-action="open-object"]');
    if(objBtn){ openObject(objBtn.getAttribute('data-id')); return; }

    var lvlBtn = e.target.closest('[data-action="open-level"]');
    if(lvlBtn){ openLevel(lvlBtn.getAttribute('data-id')); return; }

    var sosBtn = e.target.closest('[data-action="open-sos"]');
    if(sosBtn){ openSOS(); return; }

    var camBtn = e.target.closest('[data-action="open-camera"]');
    if(camBtn){ openCamera(); return; }

    var closeBtn = e.target.closest('[data-action="close-modal"]');
    if(closeBtn){ closeSheet(); return; }

    if(e.target.id==='overlay'){ closeSheet(); return; }

    var themeBtn = e.target.closest('[data-action="set-theme"]');
    if(themeBtn){ setTheme(themeBtn.getAttribute('data-value')); return; }

    var installBtn = e.target.closest('[data-action="install-app"]');
    if(installBtn){
      if(deferredInstallPrompt){
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.finally(function(){
          deferredInstallPrompt = null;
          state.canInstall = false;
          render();
        });
      }
      return;
    }

    var updateBtn = e.target.closest('[data-action="apply-update"]');
    if(updateBtn){
      if(swRegistration && swRegistration.waiting) swRegistration.waiting.postMessage('SKIP_WAITING');
      else window.location.reload();
      return;
    }

    // ---- admin: forms ----
    var openObjFormBtn = e.target.closest('[data-action="open-object-form"]');
    if(openObjFormBtn){ openObjectForm(); return; }

    var openUserFormBtn = e.target.closest('[data-action="open-user-form"]');
    if(openUserFormBtn){ openUserForm(); return; }

    var openRaciFormBtn = e.target.closest('[data-action="open-raci-form"]');
    if(openRaciFormBtn){ openRaciForm(); return; }

    var statusPickBtn = e.target.closest('[data-action="form-status-pick"]');
    if(statusPickBtn){
      state.formDraft.status = statusPickBtn.getAttribute('data-value');
      var statusSiblings = statusPickBtn.parentElement.querySelectorAll('.segmented__opt');
      statusSiblings.forEach(function(b){ b.classList.toggle('is-active', b===statusPickBtn); });
      return;
    }

    var levelToggleBtn = e.target.closest('[data-action="form-level-toggle"]');
    if(levelToggleBtn){
      var lvVal = parseInt(levelToggleBtn.getAttribute('data-value'), 10);
      var lvIdx = state.formDraft.levels.indexOf(lvVal);
      if(lvIdx===-1) state.formDraft.levels.push(lvVal); else state.formDraft.levels.splice(lvIdx, 1);
      levelToggleBtn.classList.toggle('is-active');
      return;
    }

    var rolePickBtn = e.target.closest('[data-action="form-role-pick"]');
    if(rolePickBtn){
      state.formDraft.roleId = rolePickBtn.getAttribute('data-value');
      var roleSiblings = rolePickBtn.parentElement.querySelectorAll('[data-action="form-role-pick"]');
      roleSiblings.forEach(function(b){ b.classList.toggle('is-active', b===rolePickBtn); });
      return;
    }

    var saveObjBtn = e.target.closest('[data-action="save-object"]');
    if(saveObjBtn){
      var nameEl = document.getElementById('fObjName');
      var zoneEl = document.getElementById('fObjZone');
      var objName = nameEl ? nameEl.value.trim() : '';
      if(!objName){ if(nameEl) nameEl.focus(); return; }
      nextObjectSeq++;
      state.objects.push({
        id: 'o'+nextObjectSeq,
        name: objName,
        zone: (zoneEl && zoneEl.value.trim()) || 'Не указано',
        icon: 'i-drop',
        status: state.formDraft.status,
        updated: 'сегодня',
        levels: state.formDraft.levels.slice()
      });
      state.formDraft = null;
      save();
      closeSheet();
      render();
      return;
    }

    var saveUserBtn = e.target.closest('[data-action="save-user"]');
    if(saveUserBtn){
      var uNameEl = document.getElementById('fUserName');
      var uName = uNameEl ? uNameEl.value.trim() : '';
      if(!uName || !state.formDraft.roleId){ if(uNameEl) uNameEl.focus(); return; }
      nextUserSeq++;
      state.users.push({id:'u'+nextUserSeq, name:uName, roleId:state.formDraft.roleId});
      state.formDraft = null;
      save();
      closeSheet();
      render();
      return;
    }

    var saveRaciBtn = e.target.closest('[data-action="save-raci-row"]');
    if(saveRaciBtn){
      var opEl = document.getElementById('fRaciOp');
      var opName = opEl ? opEl.value.trim() : '';
      if(!opName){ if(opEl) opEl.focus(); return; }
      state.raci.push({op:opName, r:['','','','']});
      save();
      closeSheet();
      render();
      return;
    }

    var delObjBtn = e.target.closest('[data-action="delete-object"]');
    if(delObjBtn){
      var delObjId = delObjBtn.getAttribute('data-id');
      state.objects = state.objects.filter(function(o){ return o.id!==delObjId; });
      save(); render();
      return;
    }

    var delUserBtn = e.target.closest('[data-action="delete-user"]');
    if(delUserBtn){
      var delUserId = delUserBtn.getAttribute('data-id');
      state.users = state.users.filter(function(u){ return u.id!==delUserId; });
      save(); render();
      return;
    }

    var delRaciBtn = e.target.closest('[data-action="delete-raci-row"]');
    if(delRaciBtn){
      var delRaciIdx = parseInt(delRaciBtn.getAttribute('data-index'), 10);
      state.raci.splice(delRaciIdx, 1);
      save(); render();
      return;
    }

    var cycleRaciBtn = e.target.closest('[data-action="cycle-raci"]');
    if(cycleRaciBtn){
      var cycleRow = parseInt(cycleRaciBtn.getAttribute('data-row'), 10);
      var cycleCol = parseInt(cycleRaciBtn.getAttribute('data-col'), 10);
      var cycleOrder = ['', 'R', 'A', 'C', 'I'];
      var cycleCur = state.raci[cycleRow].r[cycleCol] || '';
      state.raci[cycleRow].r[cycleCol] = cycleOrder[(cycleOrder.indexOf(cycleCur)+1) % cycleOrder.length];
      save();
      render();
      return;
    }
  });

  // ---- PWA: offline indicator, update flow, install prompt ----
  var swRegistration = null;
  var deferredInstallPrompt = null;

  function updateToast(){
    var el = document.getElementById('toast');
    if(!el) return;
    if(state.updateReady){
      el.className = 'toast';
      el.innerHTML = '<span class="toast__icon">'+icon('i-refresh')+'</span>'+
        '<span class="toast__text">Доступно обновление приложения</span>'+
        '<button class="toast__action" data-action="apply-update">Обновить</button>';
      el.hidden = false;
    } else if(!state.online){
      el.className = 'toast toast--offline';
      el.innerHTML = '<span class="toast__icon">'+icon('i-wifi-off')+'</span>'+
        '<span class="toast__text">Нет подключения. Данные сохраняются локально</span>';
      el.hidden = false;
    } else {
      el.hidden = true;
      el.innerHTML = '';
    }
  }

  window.addEventListener('online', function(){ state.online = true; updateToast(); });
  window.addEventListener('offline', function(){ state.online = false; updateToast(); });

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    state.canInstall = true;
    if(state.tab==='profile') render();
  });
  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null;
    state.canInstall = false;
    if(state.tab==='profile') render();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        swRegistration = reg;
        if(reg.waiting && navigator.serviceWorker.controller){ state.updateReady = true; updateToast(); }
        reg.addEventListener('updatefound', function(){
          var installing = reg.installing;
          if(!installing) return;
          installing.addEventListener('statechange', function(){
            if(installing.state==='installed' && navigator.serviceWorker.controller){
              state.updateReady = true;
              updateToast();
            }
          });
        });
      }).catch(function(){});
    });
    var refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });
  }

  render();
  updateToast();
})();
</script>

</body>
</html>
